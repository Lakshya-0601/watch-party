# Render Blueprint — the whole app (website + room server + realtime gateway)
# as one always-on Node service. Render dashboard → New → Blueprint → pick
# this repo; it asks for the values marked `sync: false`.
services:
  - type: web
    name: reelroom
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    # server.mjs serves Next.js and wss://…/realtime on Render's single port
    startCommand: npm start
    healthCheckPath: /auth
    envVars:
      # Firebase web app config (Project settings → Your apps)
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      # Firebase service account (Project settings → Service accounts)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Random secrets generated by Render (signed-in sessions, extension tokens)
      - key: REELROOM_SESSION_SECRET
        generateValue: true
      - key: REELROOM_TOKEN_SECRET
        generateValue: true
      # APP_URL is optional: Render's RENDER_EXTERNAL_URL is used automatically
